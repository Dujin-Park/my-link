<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 240" fill="none">
  <!-- Background Surface: TDS Blue-50 -->
  <rect width="240" height="240" rx="120" fill="#E8F3FF" />

  <!-- Tossface Yellow-500 Character Body / Face -->
  <circle cx="120" cy="116" r="68" fill="#FFC342" />
  <!-- Subtle highlight on yellow face -->
  <path d="M76 80C88 64 108 56 128 58" stroke="#FFDD78" stroke-width="8" stroke-linecap="round" />

  <!-- Ears -->
  <circle cx="52" cy="118" r="14" fill="#FFC342" />
  <circle cx="188" cy="118" r="14" fill="#FFC342" />

  <!-- Glasses (Brown-900: oklch(0.359 0.083 39) -> #5B3716) -->
  <rect x="78" y="98" width="36" height="26" rx="10" fill="#FFFFFF" fill-opacity="0.45" stroke="#5B3716" stroke-width="5" />
  <rect x="126" y="98" width="36" height="26" rx="10" fill="#FFFFFF" fill-opacity="0.45" stroke="#5B3716" stroke-width="5" />
  <line x1="114" y1="110" x2="126" y2="110" stroke="#5B3716" stroke-width="5" stroke-linecap="round" />

  <!-- Eyes (Brown-900) -->
  <circle cx="96" cy="111" r="5" fill="#5B3716" />
  <circle cx="144" cy="111" r="5" fill="#5B3716" />

  <!-- Eyebrows (Brown-700: #734A26) -->
  <path d="M84 88C90 84 100 84 106 87" stroke="#734A26" stroke-width="4.5" stroke-linecap="round" />
  <path d="M134 87C140 84 150 84 156 88" stroke="#734A26" stroke-width="4.5" stroke-linecap="round" />

  <!-- Gentle Smile (Brown-900) -->
  <path d="M106 136C112 143 128 143 134 136" stroke="#5B3716" stroke-width="5" stroke-linecap="round" />

  <!-- Warm Cheeks (Orange-400) -->
  <ellipse cx="78" cy="130" rx="8" ry="4.5" fill="#F59E0B" fill-opacity="0.35" />
  <ellipse cx="162" cy="130" rx="8" ry="4.5" fill="#F59E0B" fill-opacity="0.35" />

  <!-- Minimal Laptop Silhouette at bottom (TDS Grey-900 & White) -->
  <rect x="68" y="166" width="104" height="58" rx="12" fill="#191F28" />
  <circle cx="120" cy="195" r="7" fill="#3182F6" />
</svg>
